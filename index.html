<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <title>Print Pro V4.5</title>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #2563eb; 
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-page: #f3f4f6;
            --bg-card: #ffffff;
            --border-soft: #e5e7eb;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        body { font-family: 'Inter', sans-serif; padding: 20px 15px; background-color: var(--bg-page); color: var(--text-main); margin: 0; -webkit-font-smoothing: antialiased;}
        .card { background: var(--bg-card); padding: 28px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-float); max-width: 460px; margin: 0 auto 20px auto; border: 1px solid var(--border-soft); }
        
        h2 { margin: 0 0 24px 0; text-align: center; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 24px 0 12px 0; border-bottom: 2px solid var(--bg-page); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;}

        .input-group { text-align: left; margin-bottom: 16px; }
        .input-group label { font-size: 13px; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 8px;}
        
        .row { display: flex; gap: 12px; align-items: flex-end; }
        .row .input-group { flex: 1; }

        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-soft); background: #f9fafb; border-radius: var(--radius-md); font-size: 14px; transition: all 0.2s; box-sizing: border-box;}
        input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        button { background: var(--primary); color: white; border: none; padding: 16px; font-size: 15px; border-radius: var(--radius-md); cursor: pointer; width: 100%; font-weight: 600; transition: all 0.2s; margin-top: 10px; }
        button:hover { background: var(--primary-hover); transform: translateY(-1.5px); }
        button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }

        /* Tombol Pindai & Setting (Sejajar) */
        .btn-side { background: #f3f4f6; color: var(--text-main); border: 1px solid var(--border-soft); padding: 0 16px; width: 100px; height: 45px; margin: 0; font-size: 13px; font-weight: 600; flex-shrink: 0;}
        .btn-side:hover { background: #e5e7eb; }
        .btn-config { background: var(--primary); color: white; border: none; }
        .btn-config:hover { background: var(--primary-hover); }

        /* Divider ATAU */
        .divider { display: flex; align-items: center; text-align: center; margin: 16px 0; color: #94a3b8; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider span { padding: 0 10px; }

        /* Modal Design */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.7); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; padding: 30px; border-radius: var(--radius-lg); width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: modalIn 0.3s ease-out; }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Toast Notifications */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 380px; pointer-events: none;}
        .toast { padding: 16px 20px; border-radius: var(--radius-md); color: white; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); animation: toastIn 0.25s ease-out forwards; opacity: 0; pointer-events: auto;}
        .toast.success { background: var(--text-main); }
        .toast.error { background: var(--danger); }
        @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }

        /* Status & History */
        #realtimeStatus { display:none; margin-top:20px; padding:16px; border-radius:var(--radius-md); background:#f8fafc; border: 1px solid var(--border-soft); }
        .progress-container { height:6px; background:#e2e8f0; margin-top:12px; border-radius:10px; overflow:hidden;}
        #progressBar { width:0%; height:100%; background: var(--success); transition: width 0.4s; }
        .history-item { background: white; border-left: 4px solid var(--primary); padding: 14px; margin-bottom: 10px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border-soft); }
        
        #previewContainer { margin-top: 15px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-soft); }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏢 Print Server Pro v4.5</h2>
        
        <button id="installPwaBtn" style="display:none; background:#0891b2; margin-bottom:15px;">📲 Install Aplikasi</button>

        <div class="section-title">
            <span>📍 Jaringan & Perangkat</span>
            <span style="font-size:10px; color:var(--primary); cursor:pointer;" onclick="showHelpModal()">Bantuan IP?</span>
        </div>
        
        <div class="row">
            <div class="input-group">
                <label>🖥️ IP Address Server:</label>
                <input type="text" id="ipAddress" placeholder="192.168.1.xx">
            </div>
            <button class="btn-side" id="scanBtn" onclick="scanNetwork()">🔍 Pindai</button>
        </div>

        <div class="row">
            <div class="input-group">
                <label>🖨️ Pilih Printer:</label>
                <select id="printerSelect"><option value="">Default Printer...</option></select>
            </div>
            <button class="btn-side btn-config" onclick="showConfigModal()">⚙️ Setting</button>
        </div>

        <div class="section-title"><span>📁 Pilih File</span></div>
        <div class="input-group">
            <input type="file" id="fileInput" accept=".pdf, .docx, .doc, .xlsx, .xls, .png, .jpg, .jpeg" style="width:100%; padding:8px; border:1px dashed #cbd5e1; border-radius:var(--radius-md); font-size:12px;" />
        </div>
        
        <div id="previewContainer" style="display: none;">
            <div style="font-size: 10px; font-weight: 700; color: var(--primary); margin-bottom: 5px;">👀 PREVIEW:</div>
            <canvas id="pdfPreview" style="width: 100%; border-radius: 8px; display: none;"></canvas>
            <img id="imgPreview" style="width: 100%; border-radius: 8px; display: none;" />
        </div>

        <div class="divider"><span>ATAU</span></div>
        <div class="input-group">
            <input type="text" id="fileUrl" placeholder="https://...)">
        </div>
        
        <button id="printBtn" onclick="showPinModal()">🚀 PRINT</button>
        
        <div id="realtimeStatus">
            <div id="statusMessage" style="font-size:12px; font-weight:600;">Menunggu...</div>
            <div class="progress-container"><div id="progressBar"></div></div>
        </div>
    </div>

    <div class="card" style="padding: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-size:12px; font-weight:700; color:var(--text-muted);">🕒 RIWAYAT</span>
            <span style="font-size:10px; color:var(--danger); cursor:pointer;" onclick="clearHistory()">Hapus Semua</span>
        </div>
        <ul id="historyList" style="list-style:none; padding:0; margin:0;"></ul>
    </div>

    <div id="configModal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0 0 20px 0; text-align:center;">⚙️ Pengaturan Dokumen</h3>
            <div class="row">
                <div class="input-group"><label>🎨 Warna:</label>
                    <select id="colorMode"><option value="color">Berwarna</option><option value="monochrome">B/W</option></select>
                </div>
                <div class="input-group"><label>📏 Kertas:</label>
                    <select id="paperSize"><option value="A4">A4</option><option value="F4">F4</option><option value="Legal">Legal</option></select>
                </div>
            </div>
            <div class="row">
                <div class="input-group"><label>📄 Jumlah Copy:</label><input type="number" id="copies" value="1" min="1"></div>
                <div class="input-group"><label>📑 Rincian Halaman:</label><input type="text" id="pages" placeholder="Cth: 1,3,5-7"></div>
            </div>
            <div class="row">
                <div class="input-group"><label>🔄 Orientasi:</label>
                    <select id="orientation"><option value="portrait">Potrait</option><option value="landscape">Landscape</option></select>
                </div>
                <div class="input-group"><label>🗂️ Hal per Sheet:</label>
                    <select id="pagesPerSheet"><option value="1">1 Hal</option><option value="2">2 Hal</option></select>
                </div>
            </div>
            <button onclick="closeConfigModal()" style="margin-top:20px;">Simpan & Tutup</button>
        </div>
    </div>

    <div id="pinModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <h3>🔑 PIN Keamanan</h3>
            <p style="font-size:13px; color:var(--text-muted);">Masukkan PIN untuk mulai mencetak</p>
            <input type="password" id="modalPinInput" maxlength="6" inputmode="numeric" style="font-size:32px; letter-spacing:10px; text-align:center;">
            <div class="row" style="margin-top:20px;">
                <button style="background:#eee; color:#333;" onclick="closePinModal()">Batal</button>
                <button onclick="confirmAndPrint()">Konfirmasi</button>
            </div>
        </div>
    </div>

    <div id="helpModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center;">Cek IP Manual</h3>
            <p style="font-size:13px; line-height:1.6;">Buka <strong>CMD</strong> di PC, ketik <strong>ipconfig</strong>, lalu cari <strong>IPv4 Address</strong>.</p>
            <button onclick="document.getElementById('helpModal').style.display='none'">Mengerti</button>
        </div>
    </div>

    <script>
        // MODAL HANDLERS
        function showConfigModal() { document.getElementById('configModal').style.display = 'flex'; }
        function closeConfigModal() { document.getElementById('configModal').style.display = 'none'; showToast("Konfigurasi disimpan", "info"); }
        function showPinModal() { 
            if(!document.getElementById('fileInput').files[0] && !document.getElementById('fileUrl').value) return showToast("Pilih file dulu!", "error");
            document.getElementById('pinModal').style.display = 'flex'; 
            document.getElementById('modalPinInput').focus();
        }
        function closePinModal() { document.getElementById('pinModal').style.display = 'none'; document.getElementById('modalPinInput').value = ''; }
        function showHelpModal() { document.getElementById('helpModal').style.display = 'flex'; }

        // TOAST SYSTEM
        function showToast(message, type = 'info') {
            let container = document.getElementById('toastContainer');
            if(!container) {
                container = document.createElement('div'); container.id = 'toastContainer'; container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div'); toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '🚨', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type]}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 6000);
        }

        // PREVIEW LOGIC
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            const container = document.getElementById('previewContainer');
            const pdfCanvas = document.getElementById('pdfPreview');
            const imgPreview = document.getElementById('imgPreview');
            if(!file) { container.style.display='none'; return; }
            container.style.display='block'; pdfCanvas.style.display='none'; imgPreview.style.display='none';

            if(file.type === 'application/pdf') {
                pdfCanvas.style.display='block';
                const reader = new FileReader();
                reader.onload = async function() {
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({scale: 1});
                    const context = pdfCanvas.getContext('2d');
                    pdfCanvas.height = viewport.height; pdfCanvas.width = viewport.width;
                    await page.render({canvasContext: context, viewport: viewport}).promise;
                };
                reader.readAsArrayBuffer(file);
            } else if(file.type.startsWith('image/')) {
                imgPreview.style.display='block';
                const reader = new FileReader();
                reader.onload = e => imgPreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        // SOCKET & PRINT LOGIC
        let socket;
        function connectSocket(ip) {
            if(socket) socket.disconnect();
            socket = io(`http://${ip}:3000`);
            socket.on('print-status', data => {
                const bar = document.getElementById('progressBar');
                document.getElementById('realtimeStatus').style.display = 'block';
                document.getElementById('statusMessage').innerText = data.message;
                const steps = { 'processing': 20, 'downloading': 40, 'converting': 60, 'printing': 80, 'success': 100, 'error': 100 };
                bar.style.width = (steps[data.type] || 0) + '%';
                if(data.type === 'success') showToast("Selesai!", "success");
                if(data.type === 'error') showToast(data.message, "error");
            });
        }

        async function scanNetwork() {
            const scanBtn = document.getElementById('scanBtn');
            const baseIp = prompt("Blok IP WiFi (Cth: 192.168.1):", "192.168.1");
            if(!baseIp) return;
            scanBtn.disabled = true; scanBtn.innerText = "⏳...";
            let found = [];
            for(let attempt = 1; attempt <= 3 && found.length === 0; attempt++) {
                const promises = [];
                for(let i=1; i<255; i++) {
                    const target = `${baseIp}.${i}`;
                    promises.push(fetch(`http://${target}:3000/ping`, { signal: AbortSignal.timeout(1500) })
                        .then(r => r.json()).then(d => { if(d.status === 'PrintServerActive') found.push({ip: target, name: d.hostname}); })
                        .catch(() => {}));
                }
                await Promise.allSettled(promises);
            }
            scanBtn.disabled = false; scanBtn.innerText = "🔍 Pindai";
            if(found.length > 0) {
                const sel = document.getElementById('ipSelect'); sel.style.display = "block"; sel.innerHTML = "";
                found.forEach(p => sel.add(new Option(`${p.name} (${p.ip})`, p.ip)));
                updateIpAndFetchPrinters();
            } else showToast("PC tidak ditemukan", "error");
        }

        function updateIpAndFetchPrinters() {
            const ip = document.getElementById('ipSelect').value;
            document.getElementById('ipAddress').value = ip;
            fetchPrinters(ip); connectSocket(ip);
        }

        async function fetchPrinters(ip) {
            try {
                const r = await fetch(`http://${ip}:3000/printers`);
                const data = await r.json();
                const sel = document.getElementById('printerSelect');
                sel.innerHTML = '<option value="">Default Printer</option>';
                data.forEach(p => sel.add(new Option(p.name, p.name)));
            } catch (e) { showToast("Gagal muat printer", "error"); }
        }

        async function confirmAndPrint() {
            const pin = document.getElementById('modalPinInput').value;
            if(!pin) return showToast("Isi PIN!", "error");
            closePinModal();
            const ip = document.getElementById('ipAddress').value;
            const formData = new FormData();
            formData.append('document', document.getElementById('fileInput').files[0]);
            formData.append('fileUrl', document.getElementById('fileUrl').value);
            formData.append('pin', pin);
            formData.append('copies', document.getElementById('copies').value);
            formData.append('pages', document.getElementById('pages').value);
            formData.append('printerName', document.getElementById('printerSelect').value);
            formData.append('colorMode', document.getElementById('colorMode').value);
            formData.append('paperSize', document.getElementById('paperSize').value);
            formData.append('orientation', document.getElementById('orientation').value);
            formData.append('pagesPerSheet', document.getElementById('pagesPerSheet').value);

            try {
                const r = await fetch(`http://${ip}:3000/print`, { method: 'POST', body: formData });
                if(r.ok) {
                    saveHistory(document.getElementById('fileInput').files[0]?.name || "Link URL");
                    document.getElementById('fileInput').value = ""; document.getElementById('fileUrl').value = "";
                } else showToast(await r.text(), "error");
            } catch (e) { showToast("Koneksi gagal", "error"); }
        }

        function saveHistory(name) {
            let h = JSON.parse(localStorage.getItem('h_v45')) || [];
            h.unshift({ name, time: new Date().toLocaleString() });
            localStorage.setItem('h_v45', JSON.stringify(h.slice(0, 5)));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('historyList');
            const h = JSON.parse(localStorage.getItem('h_v45')) || [];
            list.innerHTML = h.map(i => `<li class="history-item"><strong>${i.name}</strong><br><small>${i.time}</small></li>`).join('');
        }
        function clearHistory() { localStorage.removeItem('h_v45'); loadHistory(); }
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
