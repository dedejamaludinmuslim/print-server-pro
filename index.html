<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print App Android</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; text-align: center; background-color: #f4f7f6; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { margin-top: 0; color: #2c3e50; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 14px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { 
            width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;
        }
        button { 
            background-color: #3498db; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.3s; margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pusat Print Jaringan</h2>
        
        <div class="input-group">
            <label for="ipAddress">IP Address PC Tujuan:</label>
            <input type="text" id="ipAddress" placeholder="Contoh: 192.168.1.46" value="192.168.1.46">
        </div>

        <div class="input-group">
            <label for="fileInput">Pilih File PDF:</label>
            <input type="file" id="fileInput" accept=".pdf" />
        </div>
        
        <button id="printBtn" onclick="uploadAndPrint()">Kirim & Print</button>

        <div id="status"></div>
    </div>

    <script>
        async function uploadAndPrint() {
            const fileInput = document.getElementById('fileInput');
            const ipAddress = document.getElementById('ipAddress').value.trim(); // Mengambil IP dari inputan
            const statusDiv = document.getElementById('status');
            const printBtn = document.getElementById('printBtn');

            if (!ipAddress) {
                statusDiv.innerText = "⚠️ IP Address PC tidak boleh kosong!";
                statusDiv.style.color = "#e74c3c";
                return;
            }

            if (fileInput.files.length === 0) {
                statusDiv.innerText = "⚠️ Pilih file PDF terlebih dahulu!";
                statusDiv.style.color = "#e74c3c";
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('document', file); 

            // Membuat URL server secara dinamis berdasarkan input IP
            const serverUrl = `http://${ipAddress}:3000/print`;

            statusDiv.innerText = `⏳ Mengirim file ke ${ipAddress}...`;
            statusDiv.style.color = "#f39c12";
            printBtn.disabled = true;
            printBtn.innerText = "Mengirim...";

            try {
                const response = await fetch(serverUrl, { method: 'POST', body: formData });
                const resultText = await response.text();

                if (response.ok) {
                    statusDiv.innerText = "✅ Sukses: " + resultText;
                    statusDiv.style.color = "#27ae60";
                } else {
                    statusDiv.innerText = "❌ Gagal: " + resultText;
                    statusDiv.style.color = "#e74c3c";
                }
            } catch (error) {
                statusDiv.innerText = `🚨 Error: Gagal terhubung ke ${ipAddress}. Pastikan PC tersebut menyala dan IP-nya benar.`;
                statusDiv.style.color = "#e74c3c";
            } finally {
                printBtn.disabled = false;
                printBtn.innerText = "Kirim & Print";
            }
        }
    </script>
</body>
</html>
