<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <title>Print Pro V4.4 - Classic Edition</title>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #2563eb; 
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-page: #f3f4f6;
            --bg-card: #ffffff;
            --border-soft: #e5e7eb;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        body { font-family: 'Inter', sans-serif; padding: 15px; background-color: var(--bg-page); color: var(--text-main); margin: 0; }
        .card { background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 450px; margin: 0 auto 15px auto; border: 1px solid var(--border-soft); }
        h2 { margin: 0 0 15px 0; text-align: center; font-size: 22px; }

        .section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin: 15px 0 10px 0; border-bottom: 1px solid var(--border-soft); padding-bottom: 5px; display: flex; justify-content: space-between; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 5px; }
        
        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }

        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-md); font-size: 14px; box-sizing: border-box; background: #f9fafb; }
        input:focus { outline: none; border-color: var(--primary); background: #fff; }

        .adv-box { background: #f8fafc; border: 1px solid var(--border-soft); padding: 15px; border-radius: var(--radius-md); margin-bottom: 10px; }

        button { background: var(--primary); color: white; border: none; padding: 14px; font-size: 15px; border-radius: var(--radius-md); cursor: pointer; width: 100%; font-weight: 600; transition: 0.2s; margin-top: 5px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-scan { background: #f3f4f6; color: #333; border: 1px solid var(--border-soft); width: auto; padding: 0 15px; font-size: 12px; margin: 0; }

        .divider { display: flex; align-items: center; text-align: center; margin: 12px 0; color: #94a3b8; font-size: 10px; font-weight: 700; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider span { padding: 0 10px; }

        /* Toast */
        .toast-container { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 350px; }
        .toast { padding: 12px 15px; border-radius: 8px; color: white; font-size: 13px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); animation: slideIn 0.3s forwards; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Status & Preview */
        #realtimeStatus { display:none; margin-top:10px; padding:12px; background:#f8fafc; border-radius:8px; border: 1px solid var(--border-soft); }
        .progress-bar { height:6px; background:#e2e8f0; border-radius:10px; overflow:hidden; margin-top:8px; }
        #progressFill { width:0%; height:100%; background:var(--success); transition:0.3s; }
        #previewContainer { margin-top: 10px; border: 1px solid var(--border-soft); border-radius: 8px; overflow: hidden; }

        /* Modal PIN */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 80%; max-width: 300px; text-align: center; }
        
        .history-item { background: white; padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏢 Print Pro Classic</h2>
        
        <button id="installPwaBtn" style="display:none; background:#0891b2; margin-bottom:15px;">📲 Simpan ke Layar HP (Install)</button>

        <div class="section-title">📍 Jaringan & Mesin</div>
        <div class="input-group">
            <div class="row">
                <input type="text" id="ipAddress" placeholder="Masukkan IP PC (192.168.1.xx)">
                <button class="btn-scan" id="scanBtn" onclick="scanNetwork()">🔍 Pindai</button>
            </div>
            <select id="ipSelect" style="display:none; margin-top: 5px;" onchange="updateIpAndFetchPrinters()"></select>
        </div>
        <div class="input-group">
            <select id="printerSelect"><option value="">-- Pilih Mesin Printer --</option></select>
        </div>

        <div class="section-title">⚙️ Konfigurasi Dokumen</div>
        <div class="adv-box">
            <div class="row">
                <div class="input-group"><label>🎨 Warna</label>
                    <select id="colorMode"><option value="color">Berwarna</option><option value="monochrome">B/W</option></select>
                </div>
                <div class="input-group"><label>📏 Kertas</label>
                    <select id="paperSize"><option value="A4">A4</option><option value="F4">F4</option><option value="Legal">Legal</option></select>
                </div>
            </div>
            <div class="row">
                <div class="input-group"><label>📄 Copy</label><input type="number" id="copies" value="1" min="1"></div>
                <div class="input-group"><label>📑 Halaman</label><input type="text" id="pages" placeholder="Cth: 1,3,5-7"></div>
            </div>
            <div class="row">
                <div class="input-group"><label>🔄 Orientasi</label>
                    <select id="orientation"><option value="portrait">Potrait</option><option value="landscape">Landscape</option></select>
                </div>
                <div class="input-group"><label>🗂️ Hal/Lembar</label>
                    <select id="pagesPerSheet"><option value="1">1 Halaman</option><option value="2">2 Halaman</option></select>
                </div>
            </div>
        </div>

        <div class="section-title">📁 Sumber File</div>
        <div class="input-group">
            <input type="file" id="fileInput" accept=".pdf, .docx, .doc, .xlsx, .xls, .png, .jpg, .jpeg" />
        </div>
        <div id="previewContainer" style="display:none;">
            <canvas id="pdfPreview" style="width:100%;"></canvas>
            <img id="imgPreview" style="width:100%;" />
        </div>

        <div class="divider"><span>ATAU LINK</span></div>
        <div class="input-group">
            <input type="text" id="fileUrl" placeholder="Tempel URL Dokumen (https://...)">
        </div>
        
        <button id="printBtn" onclick="showPinModal()">🚀 MULAI CETAK</button>
        
        <div id="realtimeStatus">
            <div id="statusMessage" style="font-size:12px; font-weight:700;">Menunggu...</div>
            <div class="progress-bar"><div id="progressFill"></div></div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🕒 Riwayat <span style="color:var(--danger); cursor:pointer;" onclick="clearHistory()">Hapus</span></div>
        <div id="historyList"></div>
    </div>

    <div id="pinModal" class="modal">
        <div class="modal-content">
            <h3>🔑 PIN Keamanan</h3>
            <input type="password" id="modalPinInput" maxlength="6" inputmode="numeric" style="font-size:24px; text-align:center; letter-spacing:5px;">
            <div class="row" style="margin-top:15px;">
                <button style="background:#ccc;" onclick="closePinModal()">Batal</button>
                <button onclick="confirmAndPrint()">Cetak</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. PWA REGISTRATION (FITUR YANG HILANG) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW terdaftar!'))
                .catch(err => console.log('SW Gagal!'));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('installPwaBtn').style.display = 'block';
        });

        document.getElementById('installPwaBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('installPwaBtn').style.display = 'none';
                deferredPrompt = null;
            }
        });

        // --- 2. TOAST SYSTEM ---
        function showToast(msg, type = 'info') {
            let container = document.getElementById('toastContainer');
            if(!container) {
                container = document.createElement('div'); container.id = 'toastContainer'; container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.background = type === 'error' ? '#ef4444' : '#1f2937';
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 6000);
        }

        // --- 3. PRINT PREVIEW ---
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            const container = document.getElementById('previewContainer');
            if(!file) { container.style.display='none'; return; }
            container.style.display='block';
            document.getElementById('pdfPreview').style.display='none';
            document.getElementById('imgPreview').style.display='none';

            if(file.type === 'application/pdf') {
                const pdfCanvas = document.getElementById('pdfPreview');
                pdfCanvas.style.display='block';
                const reader = new FileReader();
                reader.onload = async function() {
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({scale: 0.8});
                    const context = pdfCanvas.getContext('2d');
                    pdfCanvas.height = viewport.height; pdfCanvas.width = viewport.width;
                    await page.render({canvasContext: context, viewport: viewport}).promise;
                };
                reader.readAsArrayBuffer(file);
            } else if(file.type.startsWith('image/')) {
                const imgPreview = document.getElementById('imgPreview');
                imgPreview.style.display='block';
                const reader = new FileReader();
                reader.onload = e => imgPreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        // --- 4. NETWORK & PRINT LOGIC ---
        let socket;
        function connectSocket(ip) {
            if(socket) socket.disconnect();
            socket = io(`http://${ip}:3000`);
            socket.on('print-status', data => {
                document.getElementById('realtimeStatus').style.display = 'block';
                document.getElementById('statusMessage').innerText = data.message;
                const steps = { 'processing': 20, 'downloading': 40, 'converting': 60, 'printing': 80, 'success': 100, 'error': 100 };
                document.getElementById('progressFill').style.width = (steps[data.type] || 0) + '%';
                if(data.type === 'success') showToast("Berhasil dicetak!", "success");
                if(data.type === 'error') showToast(data.message, "error");
            });
        }

        async function scanNetwork() {
            const scanBtn = document.getElementById('scanBtn');
            const baseIp = prompt("Masukkan 3 blok IP (Cth: 192.168.1):", "192.168.1");
            if(!baseIp) return;
            scanBtn.disabled = true; scanBtn.innerText = "⏳...";
            let found = [];
            for(let attempt=1; attempt<=3 && found.length===0; attempt++) {
                const promises = [];
                for(let i=1; i<255; i++) {
                    const target = `${baseIp}.${i}`;
                    promises.push(fetch(`http://${target}:3000/ping`, { signal: AbortSignal.timeout(1500) })
                        .then(r => r.json()).then(d => { if(d.status === 'PrintServerActive') found.push({ip: target, name: d.hostname}); })
                        .catch(() => {}));
                }
                await Promise.allSettled(promises);
            }
            scanBtn.disabled = false; scanBtn.innerText = "🔍 Pindai";
            const sel = document.getElementById('ipSelect');
            if(found.length > 0) {
                sel.style.display = "block"; sel.innerHTML = "";
                found.forEach(p => sel.add(new Option(`${p.name} (${p.ip})`, p.ip)));
                updateIpAndFetchPrinters();
            } else showToast("PC tidak ditemukan", "error");
        }

        function updateIpAndFetchPrinters() {
            const ip = document.getElementById('ipSelect').value;
            document.getElementById('ipAddress').value = ip;
            fetchPrinters(ip); connectSocket(ip);
        }

        async function fetchPrinters(ip) {
            try {
                const r = await fetch(`http://${ip}:3000/printers`);
                const data = await r.json();
                const sel = document.getElementById('printerSelect');
                sel.innerHTML = '<option value="">Default Printer</option>';
                data.forEach(p => sel.add(new Option(p.name, p.name)));
            } catch (e) { showToast("Gagal muat printer", "error"); }
        }

        function showPinModal() {
            if(!document.getElementById('fileInput').files[0] && !document.getElementById('fileUrl').value) return showToast("Pilih file dulu!", "error");
            document.getElementById('pinModal').style.display = 'flex';
            document.getElementById('modalPinInput').focus();
        }
        function closePinModal() { document.getElementById('pinModal').style.display = 'none'; document.getElementById('modalPinInput').value = ''; }

        async function confirmAndPrint() {
            const pin = document.getElementById('modalPinInput').value;
            if(!pin) return showToast("Masukkan PIN!", "error");
            closePinModal();
            const ip = document.getElementById('ipAddress').value;
            const formData = new FormData();
            formData.append('document', document.getElementById('fileInput').files[0]);
            formData.append('fileUrl', document.getElementById('fileUrl').value);
            formData.append('pin', pin);
            formData.append('copies', document.getElementById('copies').value);
            formData.append('pages', document.getElementById('pages').value);
            formData.append('printerName', document.getElementById('printerSelect').value);
            formData.append('colorMode', document.getElementById('colorMode').value);
            formData.append('paperSize', document.getElementById('paperSize').value);
            formData.append('orientation', document.getElementById('orientation').value);
            formData.append('pagesPerSheet', document.getElementById('pagesPerSheet').value);

            try {
                const r = await fetch(`http://${ip}:3000/print`, { method: 'POST', body: formData });
                if(r.ok) {
                    saveHistory(document.getElementById('fileInput').files[0]?.name || "URL Link");
                    document.getElementById('fileInput').value = ""; document.getElementById('fileUrl').value = "";
                } else showToast(await r.text(), "error");
            } catch (e) { showToast("Gagal kirim data!", "error"); }
        }

        function saveHistory(name) {
            let h = JSON.parse(localStorage.getItem('h_v4_classic')) || [];
            h.unshift({ name, time: new Date().toLocaleString() });
            localStorage.setItem('h_v4_classic', JSON.stringify(h.slice(0, 10)));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('historyList');
            const h = JSON.parse(localStorage.getItem('h_v4_classic')) || [];
            list.innerHTML = h.map(i => `<div class="history-item"><b>${i.name}</b><br>${i.time}</div>`).join('');
        }
        function clearHistory() { localStorage.removeItem('h_v4_classic'); loadHistory(); }
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
